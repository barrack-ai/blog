<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/>
    <line x1="1000" y1="0" x2="1000" y2="700"/>
  </g>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">THE COMMON ATTACK PATTERN</text>
  <text x="600" y="64" text-anchor="middle" fill="#6b7280" font-size="13" letter-spacing="0.3">How AI copilots become weaponizable vectors across four 2026 incidents</text>

  <!-- ===== FLOW: 5 STAGES ===== -->

  <!-- Stage 1: Attacker Injects Content -->
  <rect x="40" y="100" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="65" cy="120" r="10" fill="url(#redGrad)" opacity="0.8"/>
  <text x="79" y="125" fill="#f87171" font-size="11" font-weight="600">STAGE 1</text>
  <text x="140" y="138" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Attacker Injects</text>
  <text x="140" y="155" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Malicious Content</text>
  <text x="140" y="172" text-anchor="middle" fill="#9ca3af" font-size="10">Into trusted data source</text>

  <!-- Arrow 1->2 -->
  <line x1="240" y1="140" x2="290" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" opacity="0.7"/>

  <!-- Stage 2: AI Agent Processes -->
  <rect x="300" y="100" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="325" cy="120" r="10" fill="url(#amberGrad)" opacity="0.8"/>
  <text x="339" y="125" fill="#fbbf24" font-size="11" font-weight="600">STAGE 2</text>
  <text x="400" y="138" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">AI Agent Processes</text>
  <text x="400" y="155" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Without Distinction</text>
  <text x="400" y="172" text-anchor="middle" fill="#9ca3af" font-size="10">Cannot separate user vs attacker intent</text>

  <!-- Arrow 2->3 -->
  <line x1="500" y1="140" x2="550" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" opacity="0.7"/>

  <!-- Stage 3: Elevated Privileges Inherited -->
  <rect x="560" y="100" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="585" cy="120" r="10" fill="url(#blueGrad)" opacity="0.8"/>
  <text x="599" y="125" fill="#60a5fa" font-size="11" font-weight="600">STAGE 3</text>
  <text x="660" y="138" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Attacker Inherits</text>
  <text x="660" y="155" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Agent Privileges</text>
  <text x="660" y="172" text-anchor="middle" fill="#9ca3af" font-size="10">Camera, files, credentials, network</text>

  <!-- Arrow 3->4 -->
  <line x1="760" y1="140" x2="810" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" opacity="0.7"/>

  <!-- Stage 4: Silent Exfiltration -->
  <rect x="820" y="100" width="200" height="80" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="845" cy="120" r="10" fill="url(#redGrad)" opacity="0.8"/>
  <text x="859" y="125" fill="#f87171" font-size="11" font-weight="600">STAGE 4</text>
  <text x="920" y="138" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Silent Data</text>
  <text x="920" y="155" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Exfiltration</text>
  <text x="920" y="172" text-anchor="middle" fill="#9ca3af" font-size="10">User unaware, no alerts triggered</text>

  <!-- Divider -->
  <line x1="40" y1="210" x2="1160" y2="210" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="238" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="600" letter-spacing="1">HOW EACH INCIDENT MAPS TO THIS PATTERN</text>

  <!-- ===== ROW 1: CVE-2026-26144 ===== -->
  <rect x="40" y="265" width="1120" height="85" rx="6" fill="#1a1a2e" stroke="#374151" stroke-width="0.5"/>
  <rect x="40" y="265" width="4" height="85" rx="2" fill="#ef4444"/>

  <text x="65" y="288" fill="#f87171" font-size="12" font-weight="700">CVE-2026-26144</text>
  <text x="200" y="288" fill="#6b7280" font-size="11">Excel Copilot Agent XSS</text>

  <text x="65" y="310" fill="#9ca3af" font-size="11">Crafted Excel content</text>
  <text x="65" y="324" fill="#6b7280" font-size="10">(XSS payload)</text>

  <text x="310" y="310" fill="#9ca3af" font-size="11">Copilot Agent processes</text>
  <text x="310" y="324" fill="#6b7280" font-size="10">(auto-executes on open)</text>

  <text x="570" y="310" fill="#9ca3af" font-size="11">Network egress capability</text>
  <text x="570" y="324" fill="#6b7280" font-size="10">(outbound HTTP)</text>

  <text x="830" y="310" fill="#9ca3af" font-size="11">Spreadsheet data leaked</text>
  <text x="830" y="324" fill="#6b7280" font-size="10">(zero-click, no interaction)</text>

  <!-- Arrows -->
  <line x1="250" y1="315" x2="300" y2="315" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="515" y1="315" x2="560" y2="315" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="770" y1="315" x2="820" y2="315" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>

  <!-- ===== ROW 2: GlicJack ===== -->
  <rect x="40" y="360" width="1120" height="85" rx="6" fill="#1a1a2e" stroke="#374151" stroke-width="0.5"/>
  <rect x="40" y="360" width="4" height="85" rx="2" fill="#3b82f6"/>

  <text x="65" y="383" fill="#60a5fa" font-size="12" font-weight="700">CVE-2026-0628</text>
  <text x="200" y="383" fill="#6b7280" font-size="11">GlicJack / Chrome Gemini</text>

  <text x="65" y="405" fill="#9ca3af" font-size="11">Malicious extension</text>
  <text x="65" y="419" fill="#6b7280" font-size="10">(declarativeNetRequest)</text>

  <text x="310" y="405" fill="#9ca3af" font-size="11">WebView loads Gemini</text>
  <text x="310" y="419" fill="#6b7280" font-size="10">(missing blocklist entry)</text>

  <text x="570" y="405" fill="#9ca3af" font-size="11">Camera, mic, files, screenshots</text>
  <text x="570" y="419" fill="#6b7280" font-size="10">(full browser-level access)</text>

  <text x="830" y="405" fill="#9ca3af" font-size="11">System resources exposed</text>
  <text x="830" y="419" fill="#6b7280" font-size="10">(surveillance + file theft)</text>

  <line x1="250" y1="410" x2="300" y2="410" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="515" y1="410" x2="560" y2="410" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="770" y1="410" x2="820" y2="410" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>

  <!-- ===== ROW 3: Reprompt ===== -->
  <rect x="40" y="455" width="1120" height="85" rx="6" fill="#1a1a2e" stroke="#374151" stroke-width="0.5"/>
  <rect x="40" y="455" width="4" height="85" rx="2" fill="#f59e0b"/>

  <text x="65" y="478" fill="#fbbf24" font-size="12" font-weight="700">CVE-2026-24307</text>
  <text x="210" y="478" fill="#6b7280" font-size="11">Reprompt / Copilot Personal</text>

  <text x="65" y="500" fill="#9ca3af" font-size="11">Phishing link with q param</text>
  <text x="65" y="514" fill="#6b7280" font-size="10">(copilot.microsoft.com URL)</text>

  <text x="310" y="500" fill="#9ca3af" font-size="11">Copilot auto-executes</text>
  <text x="310" y="514" fill="#6b7280" font-size="10">(double-request bypasses guard)</text>

  <text x="570" y="500" fill="#9ca3af" font-size="11">Session access + memory</text>
  <text x="570" y="514" fill="#6b7280" font-size="10">(persists after tab close)</text>

  <text x="830" y="500" fill="#9ca3af" font-size="11">Chain-request exfiltration</text>
  <text x="830" y="514" fill="#6b7280" font-size="10">(continuous, server-driven)</text>

  <line x1="250" y1="505" x2="300" y2="505" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="515" y1="505" x2="560" y2="505" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="770" y1="505" x2="820" y2="505" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>

  <!-- ===== ROW 4: PleaseFix ===== -->
  <rect x="40" y="550" width="1120" height="85" rx="6" fill="#1a1a2e" stroke="#374151" stroke-width="0.5"/>
  <rect x="40" y="550" width="4" height="85" rx="2" fill="#10b981"/>

  <text x="65" y="573" fill="#34d399" font-size="12" font-weight="700">PleaseFix</text>
  <text x="155" y="573" fill="#6b7280" font-size="11">PerplexedBrowser / Comet</text>

  <text x="65" y="595" fill="#9ca3af" font-size="11">Calendar invite</text>
  <text x="65" y="609" fill="#6b7280" font-size="10">(hidden prompt after newlines)</text>

  <text x="310" y="595" fill="#9ca3af" font-size="11">Comet agent follows</text>
  <text x="310" y="609" fill="#6b7280" font-size="10">(intent collision with user)</text>

  <text x="570" y="595" fill="#9ca3af" font-size="11">File system + 1Password vault</text>
  <text x="570" y="609" fill="#6b7280" font-size="10">(file://, auto-sign-in)</text>

  <text x="830" y="595" fill="#9ca3af" font-size="11">Files + credentials stolen</text>
  <text x="830" y="609" fill="#6b7280" font-size="10">(full account takeover)</text>

  <line x1="250" y1="600" x2="300" y2="600" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="515" y1="600" x2="560" y2="600" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>
  <line x1="770" y1="600" x2="820" y2="600" stroke="#4b5563" stroke-width="1" marker-end="url(#arrowWhite)" opacity="0.5"/>

  <!-- Footer -->
  <text x="600" y="668" text-anchor="middle" fill="#4b5563" font-size="11">Four products. Four vendors. One architectural flaw: AI agents with broad permissions processing untrusted input.</text>
  <text x="600" y="688" text-anchor="middle" fill="#374151" font-size="10">barrack.ai / blog.barrack.ai</text>
</svg>